[project]
name = "caltutors-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.5",
    "django-cors-headers>=4.7.0",
    "django-environ>=0.12.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.2.9",
    "stripe>=12.5.1",
    "gunicorn>=23.0.0",
    "redis>=5.2.0",
    "mypy>=1.18.2",
    "django-stubs>=5.2.5",
    "phonenumbers>=9.0.14",
    "postmarker>=1.0",
    "weasyprint>=66.0",
    "celery[redis]>=5.6.0",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
exclude = 'migrations/'

[tool.django-stubs]
django_settings_module = "CalTutors.settings"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
]
